[project]
name = "slm-weight-editing"
# Pas encore de release : première version (v0.1.0) quand la chaîne édition -> GGUF -> banc tourne.
version = "0.0.0"
description = "Édition directe des poids de petits modèles de langage par un LLM (Claude Opus dans Claude Code), sans entraînement, mesurée par slm-quality-bench"
readme = "README.md"
authors = [{ name = "Anaël Yahi" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
# Même version que slm-quality-bench ; à revoir si torch n'a pas de roue 3.14 sous Windows.
requires-python = ">=3.14"
keywords = ["slm", "weight-editing", "interpretability", "gguf", "ollama"]
# Dépendances ajoutées par `uv add` (numpy à la story 1 ; gguf-py en dev pour les tests),
# jamais figées de mémoire.
dependencies = [
    "numpy>=2.5.4",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[project.urls]
Homepage = "https://github.com/Aliquanto3/slm-weight-editing"
"Banc de mesure" = "https://github.com/Aliquanto3/slm-quality-bench"

[project.scripts]
slm-weight-editing = "slm_weight_editing:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "gguf>=0.19.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py314"
# Code tiers installé (BMAD, agent-cost-kit) : hors de nos règles de style.
extend-exclude = [".claude", "_bmad"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short --strict-markers"

# torch : roue CPU de l'index PyTorch sous Linux (la roue PyPI tire CUDA) ; PyPI ailleurs.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
