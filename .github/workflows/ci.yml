name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Lecture seule : aucun job n'écrit dans le dépôt.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Qualité du code (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      # Versions de ruff et de Python résolues par uv.lock et requires-python.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows : poste de développement et de mesure ; Linux et macOS : portabilité.
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      # Tenseurs synthétiques seulement : ni modèle réel ni téléchargement (AGENTS.md).
      - run: uv run pytest
